<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <f:view>
        <h:head>
            <title>Librería Waos - Web</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeflex@3.3.1/primeflex.min.css"/>
        </h:head>
        <h:body>
            <div class="card">
                <h:form id="forma-clientes">
                    <p:growl id="mensajes" showDetails="true"/>
                    <!-- Menu bar -->
                    <div class="card">
                        <p:menubar>
                            <p:menuitem value="Inicio" icon="pi pi-fw pi-user"
                                        update=":forma-clientes:clientes-tabla" actionListener="#{indexControlador.cargarDatos}"/>
                        </p:menubar>
                    </div>
                    <!-- Data Dable -->
                    <div class="card">
                        <p:dataTable value="#{indexControlador.libros}" var="cliente" id="clientes-tabla"
                                        widgetVar="clientesTabla">
                            <f:facet name="header">
                                <div class="flex justify-content-center flex-wrap card-container yellow-container">
                                    <div class="flex align-items-center justify-content-center w-30rem h-5rem bg-yellow-500 font-bold text-gray-900 border-round m-2">
                                        <h1>Libería Waos Web</h1>
                                    </div>
                                </div>
                            </f:facet>
                            <p:column headerText="Id">
                                <h:outputText value="#{cliente.id}"/>
                            </p:column>
                            <p:column headerText="Título">
                                <h:outputText value="#{cliente.titulo}"/>
                            </p:column>
                            <p:column headerText="Autor">
                                <h:outputText value="#{cliente.autor.nombre}"/>
                            </p:column>
                            <p:column headerText="Disponible">
                                <p:tag value="#{cliente.disponible ? 'Sí' : 'No'}" severity="#{cliente.disponible ? 'success' : 'danger'}"/>
                            </p:column>
                            <p:column headerText="Precio">
                                <h:outputText value="#{cliente.precio}">
                                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Ventas">
                                <h:outputText value="#{cliente.ventas}"/>
                            </p:column>
                            <p:column headerText="Existencias">
                                <h:outputText value="#{cliente.existencias}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </h:form>
            </div>
        </h:body>
    </f:view>
</h:html>
