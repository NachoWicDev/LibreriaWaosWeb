<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <f:view>
        <h:head>
            <title>Librería Waos - Web</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeflex@3.3.1/primeflex.min.css"/>
        </h:head>
        <h:body>
            <div class="card">
                <h:form id="forma-libros">
                    <p:growl id="mensajes" showDetails="true"/>
                    <!-- Menu bar -->
                    <div class="card">
                        <p:menubar>
                            <p:menuitem value="Inicio" icon="pi pi-fw pi-user"
                                        update=":forma-libros:libros-tabla" actionListener="#{indexControlador.cargarDatos}"/>
                            <p:menuitem value="Nuevo Libro" icon="pi pi-fw pi-plus" action="#{indexControlador.agregarLibro}"
                                        update=":forma-modal:modal-libro" oncomplete="PF('ventanaModalLibro').show()"/>
                        </p:menubar>
                    </div>
                    <!-- Data Dable -->
                    <div class="card">
                        <p:dataTable value="#{indexControlador.libros}" var="libro" id="libros-tabla"
                                        widgetVar="librosTabla">
                            <f:facet name="header">
                                <div class="flex justify-content-center flex-wrap card-container yellow-container">
                                    <div class="flex align-items-center justify-content-center w-30rem h-5rem bg-yellow-500 font-bold text-gray-900 border-round m-2">
                                        <h1>Librería Waos Web</h1>
                                    </div>
                                </div>
                            </f:facet>
                            <p:column headerText="Id">
                                <h:outputText value="#{libro.id}"/>
                            </p:column>
                            <p:column headerText="Título">
                                <h:outputText value="#{libro.titulo}"/>
                            </p:column>
                            <p:column headerText="Autor">
                                <h:outputText value="#{libro.autor.nombre}"/>
                            </p:column>
                            <p:column headerText="Disponible">
                                <p:tag value="#{libro.disponible ? 'Sí' : 'No'}" severity="#{libro.disponible ? 'success' : 'danger'}"/>
                            </p:column>
                            <p:column headerText="Precio">
                                <h:outputText value="#{libro.precio}">
                                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Ventas">
                                <h:outputText value="#{libro.ventas}"/>
                            </p:column>
                            <p:column headerText="Existencias">
                                <h:outputText value="#{libro.existencias}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </h:form>
                <h:form id="forma-modal">
                    <p:dialog id="modal-libro" header="Detalles Libro" showEffect="fade" modal="true" widgetVar="ventanaModalLibro" responsive="true">
                        <p:outputPanel id="libro-ventana" class="ui-fluid">
                            <div class="field">
                                <p:outputLabel for="titulo">Título</p:outputLabel>
                                <p:inputText id="titulo" value="#{indexControlador.libroSeleccionado.titulo}" required="true"/>
                                <p:message for="titulo"/>
                            </div>
                            <div class="field">
                                <p:outputLabel for="autor">Autor</p:outputLabel>
                                <p:selectOneMenu id="autor" value="#{indexControlador.idAutorSeleccionado}" required="true">
                                    <f:selectItem itemLabel="Seleccione un autor" noSelectionOption="true"/>
                                    <f:selectItems value="#{indexControlador.autores}" var="a" itemLabel="#{a.nombre}" itemValue="#{a.id}"/>
                                    <p:message for="autor"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="field">
                                <p:outputLabel for="precio">Precio</p:outputLabel>
                                <p:inputNumber id="precio" value="#{indexControlador.libroSeleccionado.precio}" required="true"/>
                                <p:message for="precio"/>
                            </div>
                            <div class="field">
                                <p:outputLabel for="existencias">Existencias</p:outputLabel>
                                <p:inputNumber id="existencias" value="#{indexControlador.libroSeleccionado.existencias}" required="true"/>
                                <p:message for="existencias"/>
                            </div>
                        </p:outputPanel>
                        <f:facet name="footer">
                            <p:commandButton value="Guardar" icon="pi pi-check" process="@form" action="#{indexControlador.guardarLibro}"
                                             update="@form, :forma-libros:libros-tabla, :mensajes"
                                             oncomplete="if (args &amp;&amp; !args.validationFailed) PF('ventanaModalLibro').hide()"/>
                            <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('ventanaModalLibro').hide()" class="ui-button-secondary" type="button"/>
                        </f:facet>
                    </p:dialog>
                </h:form>
            </div>
        </h:body>
    </f:view>
</h:html>
